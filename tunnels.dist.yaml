# Example configuration for Tunnels Manager.
#
# On first run this file is copied to ~/.config/tunnels-manager/tunnels.yaml. Your real
# configuration lives only there and is never versioned: replace these with your own.
# Press Ctrl+R in the app to reload the file, or edit any tunnel from the app itself.
#
# type: iap (the default) is equivalent to
#   gcloud compute start-iap-tunnel <instance> <remote_port> \
#     --zone=<zone> --project=<project> --local-host-port=<local_host>:<local_port>
# type: command runs 'command' as it is (kubectl port-forward, ssh -L, …) and watches
#   'local_port' to know whether the tunnel is up.

tunnels:
  # An IAP tunnel to a database behind a bastion.
  - key: shop-pro
    label: Shop (production)
    instance: my-bastion
    remote_port: 3306
    zone: europe-west1-d
    project: my-project-pro
    local_host: 127.0.0.1
    local_port: 3307

  # The same bastion, another database on another remote port.
  - key: reports-pro
    label: Reports (production)
    instance: my-bastion
    remote_port: 3307
    zone: europe-west1-d
    project: my-project-pro
    local_host: 127.0.0.1
    local_port: 3308

  # local_host: 0.0.0.0 opens the tunnel to your whole network -- handy for a VM or a
  # container, and the row says so in amber.
  - key: shop-pre
    label: Shop (staging)
    instance: my-staging-bastion
    remote_port: 3306
    zone: europe-west1-d
    project: my-project-pre
    local_host: 0.0.0.0
    local_port: 3309

  # Anything that opens a local port and stays up: here a Kubernetes port-forward.
  - key: internal-dashboard
    label: Internal dashboard
    type: command
    command: kubectl -n my-namespace port-forward svc/my-dashboard 8080:80
    local_host: 127.0.0.1
    local_port: 8080

# Shortcuts open several tunnels at once from the main menu.
bundles:
  Daily work:
    - shop-pro
    - reports-pro
